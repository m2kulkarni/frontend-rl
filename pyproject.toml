[project]
name = "proximal-env"
version = "0.1.0"
description = "RL environment recipe — generates website-replication tasks for coding-agent evaluation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "Pillow>=11.0",
    "playwright>=1.59.0",
    "scikit-image>=0.26.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
