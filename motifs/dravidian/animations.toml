# Dravidian — animation vocabulary
# Subtle motion echoing temple-architecture rhythms: lotus blooming, gopuram
# settling, peacock-iridescent color cycle.

[meta]
style = "dravidian"

[[animations]]
name = "lotus-bloom"
description = "Lotus petals open and close — clearly visible scale + rotation."
applies_to = "centerpiece_seal"
duration_sec = 4
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes lotus-bloom {
  0%, 100% { transform: scale(0.80) rotate(0deg); }
  50%      { transform: scale(1.20) rotate(30deg); }
}
.animated-lotus {
  animation: lotus-bloom 4s ease-in-out infinite;
  transform-origin: center;
}
"""

[[animations]]
name = "gopuram-bounce"
description = "Stepped gopuram silhouette translates vertically very subtly — settling and rising."
applies_to = "hero_frame"
duration_sec = 4
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes gopuram-bounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
.animated-gopuram {
  animation: gopuram-bounce 4s ease-in-out infinite;
}
"""

[[animations]]
name = "peacock-cycle"
description = "Peacock ornament's color shifts through saturation cycles — the iridescent feather effect."
applies_to = "ornament_inline"
duration_sec = 6
easing = "linear"
iteration_count = "infinite"
css = """\
@keyframes peacock-cycle {
  0%   { filter: hue-rotate(0deg)   saturate(1); }
  50%  { filter: hue-rotate(40deg)  saturate(1.4); }
  100% { filter: hue-rotate(0deg)   saturate(1); }
}
.animated-peacock {
  animation: peacock-cycle 6s linear infinite;
}
"""
