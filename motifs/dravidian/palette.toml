# Dravidian — palette
# Anchored on polychrome painted gopurams (Vijayanagara/Nayak period) + temple stone palette.

[meta]
style = "dravidian"

[colors]
granite_gray     = "#5a5450"   # the temple-stone base
sandstone_warm   = "#c19a6b"   # for sandstone temples and architectural plinths
chola_bronze     = "#8b6f3a"   # bronze sculpture, dark amber
vermilion        = "#e34234"   # sindoor / kumkum red, the dominant religious accent
saffron          = "#f4a82c"   # turmeric / robe yellow, secondary accent
peacock_blue     = "#076b88"   # peacock-feather blue
peacock_green    = "#0e7c5e"   # peacock-feather green
gold_leaf        = "#c9a23a"   # gilt for ornament
sacred_white     = "#f8f4ec"   # whitewashed lime plaster
oxblood_madder   = "#8b1538"   # deep red for emphasis
ink_black        = "#1a1a1a"   # text and outline

[variants.period_faithful]
background = "sandstone_warm"
surface    = "sacred_white"
primary    = "vermilion"
secondary  = "peacock_blue"
accent     = "gold_leaf"
ornament   = "vermilion"
text       = "ink_black"
text_emphasis = "oxblood_madder"

[variants.modern]
background = "sacred_white"
surface    = "sacred_white"
primary    = "ink_black"
secondary  = "vermilion"
accent     = "gold_leaf"
ornament   = "vermilion"
text       = "ink_black"
text_emphasis = "peacock_blue"

# Bold: temple sanctum at dusk — granite base, vermilion ornament, gold detail.
[variants.bold]
background = "granite_gray"
surface = "ink_black"
primary = "vermilion"
secondary = "gold_leaf"
accent = "saffron"
ornament = "gold_leaf"
text = "sacred_white"
text_emphasis = "vermilion"
