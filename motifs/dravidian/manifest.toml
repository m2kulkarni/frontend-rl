# Dravidian — motif manifest

[meta]
style = "dravidian"
asset_root = "svg/"
notes = """
v1 library. 11 SVGs. Bias-corrected: Wikimedia has very few authentic
public-domain Dravidian SVGs. Real Indian: 2 Om symbols, 1 lotus, 1 conch.
Compatible substitutes: 6 European-Renaissance / Art Nouveau ornaments
(Vogeler peacocks 1902, palmette) — these REQUIRE recoloring to fit the
Dravidian palette.

Real gaps (no PD SVG on Commons): kolam, yali, kalasha, torana, gopuram
silhouette, authentic Hindu mandalas. Recommend procedural generation for
these in v2 — geometry is well-defined.
"""

# ---- Authentic Hindu / Indian motifs -----------------------------------------

[[motifs]]
file = "svg/om-symbol.svg"
role = "ornament"
notes = "Om / Aum glyph, single-color path. Inline accent or section seal."
source = "https://commons.wikimedia.org/wiki/File:Om_symbol.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/om-alt.svg"
role = "ornament"
notes = "Alternate Aum glyph — slightly different rendering."
source = "https://commons.wikimedia.org/wiki/File:Aum_Om_black.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/conch-shell.svg"
role = "ornament"
notes = "Conch shell printer's ornament (Pettingill 1901). Reads as shankha — the sacred conch in Hindu iconography."
source = "https://commons.wikimedia.org/wiki/File:Dewey_Ornament_24_-_Conch.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/lotus-flower.svg"
role = "ornament"
notes = "Stylized lotus (padma). Multicolor original — see recolor_note."
source = "https://commons.wikimedia.org/wiki/File:Lotus_vector.svg"
license = "CC0"
recolorable = false
recolor_note = "Hardcoded multicolor fills — preprocess to reduce to single fill before recoloring."

# ---- Compatible substitutes (European Art Nouveau / Renaissance) -------------
# These are NOT authentically Dravidian. Use sparingly and recolor aggressively.

[[motifs]]
file = "svg/peacock-ornament.svg"
role = "ornament"
notes = "Peacock ornament (Heinrich Vogeler, 1902 — German Jugendstil). Substitute for genuine Indian peacock motifs (which don't exist as PD SVGs on Commons). Recolor to vermilion / peacock-blue."
source = "https://commons.wikimedia.org/wiki/File:Peacock_ornament_by_Heinrich_Vogeler.svg"
license = "Public domain"
recolorable = true
provenance_note = "European Art Nouveau, repurposed."

[[motifs]]
file = "svg/peacock-tailpiece.svg"
role = "tailpiece"
notes = "Peacock tailpiece (Vogeler 1902). Section-end ornament after recoloring."
source = "https://commons.wikimedia.org/wiki/File:Peacock_tailpiece_by_Heinrich_Vogeler,_1902.svg"
license = "Public domain"
recolorable = true
provenance_note = "European Art Nouveau, repurposed."

[[motifs]]
file = "svg/peacock-headpiece.svg"
role = "headpiece"
notes = "Elongated peacock-headpiece banner (Vogeler 1902)."
source = "https://commons.wikimedia.org/wiki/File:Peacock_headpiece_by_Heinrich_Vogeler,_1902.svg"
license = "Public domain"
recolorable = true
provenance_note = "European Art Nouveau, repurposed."

[[motifs]]
file = "svg/twin-peacocks.svg"
role = "headpiece"
notes = "Symmetric twin-peacock headpiece (Vogeler 1902). Composition (twin symmetric birds) maps reasonably well to Indian banner-format ornament after recoloring."
source = "https://commons.wikimedia.org/wiki/File:Headpiece_with_twin_peacocks_by_Heinrich_Vogeler,_1902.svg"
license = "Public domain"
recolorable = true
provenance_note = "European Art Nouveau, repurposed."

[[motifs]]
file = "svg/floral-headpiece.svg"
role = "headpiece"
notes = "Floral banner ornament (Vogeler 1902). Generic-foliated, broadly compatible."
source = "https://commons.wikimedia.org/wiki/File:Floral_headpiece_by_Heinrich_Vogeler,_1902.svg"
license = "Public domain"
recolorable = true
provenance_note = "European Art Nouveau, repurposed."

[[motifs]]
file = "svg/bird-headpiece.svg"
role = "headpiece"
notes = "Art Nouveau bird-and-foliage headpiece (Vogeler 1902)."
source = "https://commons.wikimedia.org/wiki/File:Headpiece_with_birds_by_Heinrich_Vogeler,_1902.svg"
