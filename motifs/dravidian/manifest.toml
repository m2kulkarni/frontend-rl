[[motifs]]
file = "svg/arabesque-palmette.svg"
role = "border"
notes = "OpenClipart palmette / running arabesque. Generic foliate ornament — useful as section divider after recoloring."
source = "https://commons.wikimedia.org/wiki/File:Arabesque-153980_1280_.svg"
license = "CC0"
recolorable = true
