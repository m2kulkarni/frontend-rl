# High Gothic — motif manifest

[meta]
style = "high-gothic"
asset_root = "svg/"
notes = """
v1 library. 16 SVGs from Wikimedia Commons.
Strong on Gothic geometric primitives (trefoil, quatrefoil, fleur-de-lis, heraldic crosses).
One Notre-Dame rose window — multicolor, ~307 KB — for hero use only.
Real gaps: standalone tracery diagrams, diaper-pattern fields, crocket/pinnacle silhouettes.
For diaper backgrounds, tile quatrefoil-in-square. For tracery, compose from primitives.
"""

# ---- Geometric primitives ----------------------------------------------------

[[motifs]]
file = "svg/quatrefoil.svg"
role = "geometric-primitive"
notes = "Architectural quatrefoil (4 overlapping circles). Core Gothic ornament unit. Tile as diaper background or use solo as window-tracery foil."
source = "https://commons.wikimedia.org/wiki/File:Quatrefoil-Architectural.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/quatrefoil-in-square.svg"
role = "frame"
notes = "Quatrefoil inscribed in a square — common Gothic spandrel motif. Best diaper-background tile."
source = "https://commons.wikimedia.org/wiki/File:Quatrefoil-Architectural-Square.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/quatrefoil-barbed.svg"
role = "geometric-primitive"
notes = "Solid-fill quatrefoil silhouette with barbed (concave) cusps."
source = "https://commons.wikimedia.org/wiki/File:Quatrefoil-Architectural-alternate.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/trefoil.svg"
role = "geometric-primitive"
notes = "Three-lobed trefoil — three overlapping circles. Most basic Gothic foil; building block of tracery."
source = "https://commons.wikimedia.org/wiki/File:Trefoil-Architectural.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/trefoil-triangle.svg"
role = "ornament"
notes = "Trefoil interlaced with equilateral triangle — Trinitarian Gothic motif."
source = "https://commons.wikimedia.org/wiki/File:Trefoil-Architectural-Equilateral-Triangle-interlaced.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/triquetra.svg"
role = "ornament"
notes = "Three interlaced 300-degree arcs forming a triquetra knot."
source = "https://commons.wikimedia.org/wiki/File:Trefoil-Triquetra.svg"
license = "Public domain"
recolorable = true

