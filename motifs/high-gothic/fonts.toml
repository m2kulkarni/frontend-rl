# High Gothic — typography pairings
# All fonts available on Google Fonts.

[meta]
style = "high-gothic"

[[variants.period_faithful.pairings]]
name = "unifrakturmaguntia-eb-garamond"
display = "UnifrakturMaguntia"
display_weights = [400]
body = "EB Garamond"
body_weights = [400, 500, 700]
notes = "Authentic blackletter for display. Body in classical serif because blackletter body text is genuinely unreadable to modern eyes."

[[variants.period_faithful.pairings]]
name = "pirata-cormorant"
display = "Pirata One"
display_weights = [400]
body = "Cormorant Garamond"
body_weights = [400, 500]
notes = "Decorative blackletter that's slightly more legible than UnifrakturMaguntia. Use when typography needs to be a little less austere."

[[variants.period_faithful.pairings]]
name = "cinzel-decorative-crimson"
display = "Cinzel Decorative"
display_weights = [400, 700, 900]
body = "Crimson Pro"
body_weights = [400, 500, 600]
notes = "Less period-extreme — Cinzel-Decorative reads as illuminated-manuscript display capitals without going full blackletter."

[[variants.modern.pairings]]
name = "cormorant-unicase-inter"
display = "Cormorant Unicase"
display_weights = [400, 600, 700]
body = "Inter"
body_weights = [400, 500, 600]
notes = "Cormorant Unicase preserves a manuscript-capital feel in modern dressings. Inter for ergonomic body."

[[variants.modern.pairings]]
name = "fraunces-source-sans"
display = "Fraunces"
display_weights = [400, 700, 900]
body = "Source Sans 3"
body_weights = [400, 600]
notes = "Fraunces has Old-Style serif heritage; works for 'cathedral-as-museum' editorial sites."

[[variants.bold.pairings]]
name = "unifraktur-eb-garamond-bold"
display = "UnifrakturMaguntia"
display_weights = [400]
body = "EB Garamond"
body_weights = [400, 500, 700]
notes = "Liturgical blackletter on cobalt — the most committed Gothic mood. Use sparingly."

[[variants.bold.pairings]]
name = "cinzel-decorative-crimson-bold"
display = "Cinzel Decorative"
display_weights = [700, 900]
body = "Crimson Pro"
body_weights = [400, 600]
notes = "Manuscript-capital display + readable body — Gothic without the legibility cost of full blackletter."
