# High Gothic — palette
# Anchored on cathedral stained glass + illuminated manuscripts.

[meta]
style = "high-gothic"

[colors]
parchment_cream  = "#f4ecd8"   # vellum / illuminated manuscript ground
stone_gray       = "#a8a39d"   # cathedral limestone
ink_black        = "#0a0a0a"   # outlines and text
walnut_dark      = "#3a2618"   # warm dark for body text in modern variant
glass_cobalt     = "#1e3a5f"   # the deep blue of Chartres / Sainte-Chapelle
glass_madder     = "#8b1538"   # the red of stained glass
glass_gold       = "#d4a017"   # warm gold, both leaf and stained-glass yellow
glass_verdigris  = "#2d5e4f"   # green of stained-glass enamel
gold_leaf        = "#c9a23a"   # ornamental accent
oxblood          = "#5a1d2a"   # darker red for emphasis

[variants.period_faithful]
background = "parchment_cream"
surface    = "stone_gray"
primary    = "glass_cobalt"
secondary  = "glass_madder"
accent     = "gold_leaf"
ornament   = "ink_black"
text       = "walnut_dark"
text_emphasis = "glass_madder"

[variants.modern]
background = "parchment_cream"
surface    = "parchment_cream"
primary    = "ink_black"
secondary  = "glass_cobalt"
accent     = "gold_leaf"
ornament   = "ink_black"
text       = "walnut_dark"
text_emphasis = "glass_cobalt"

# Bold: stained-glass-blue cathedral interior at vespers — gold leaf + crimson on cobalt.
[variants.bold]
background = "glass_cobalt"
surface = "ink_black"
primary = "gold_leaf"
secondary = "glass_madder"
accent = "glass_verdigris"
ornament = "gold_leaf"
text = "parchment_cream"
text_emphasis = "gold_leaf"
