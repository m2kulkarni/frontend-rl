# High Gothic — animation vocabulary
# Stained-glass shimmer + slow liturgical rhythm. No fast or playful motion.

[meta]
style = "high-gothic"

[[animations]]
name = "stained-glass-shimmer"
description = "Rose window or stained-glass element cycles hue dramatically — clearly visible color rotation."
applies_to = "centerpiece_seal"
duration_sec = 5
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes stained-glass-shimmer {
  0%, 100% { filter: hue-rotate(0deg)   brightness(1)   saturate(1); }
  50%      { filter: hue-rotate(80deg)  brightness(1.2) saturate(1.4); }
}
.animated-rose {
  animation: stained-glass-shimmer 5s ease-in-out infinite;
}
"""

[[animations]]
name = "fleur-pulse"
description = "Fleur-de-lis subtly pulses scale and opacity — a measured liturgical rhythm."
applies_to = "ornament_inline"
duration_sec = 4
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes fleur-pulse {
  0%, 100% { transform: scale(1);     opacity: 1; }
  50%      { transform: scale(1.08);  opacity: 0.85; }
}
.animated-fleur {
  animation: fleur-pulse 4s ease-in-out infinite;
  transform-origin: center;
}
"""

[[animations]]
name = "cross-rotate"
description = "Cross-flory rotates very slowly — almost imperceptible continuous turn."
applies_to = "centerpiece_seal"
duration_sec = 30
easing = "linear"
iteration_count = "infinite"
css = """\
@keyframes cross-rotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.animated-cross {
  animation: cross-rotate 30s linear infinite;
  transform-origin: center;
}
"""
