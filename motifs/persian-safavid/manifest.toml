# Persian Safavid — motif manifest
# Every SVG sourced from public-domain or freely-licensed origins on Wikimedia Commons.
# Recorded with provenance so we can re-source / replace files later.

[meta]
style = "persian-safavid"
asset_root = "svg/"
notes = """
v1 library. Bias toward authentic Wikimedia sources over hand-drawn motifs.
Some files have hardcoded colors or construction marks — see per-motif notes.
The generator prompt should be told which motifs are recolor-friendly.
"""

# ---- Geometric tessellations & primitives ------------------------------------

[[motifs]]
file = "svg/girih-tiles-set.svg"
role = "geometric-primitive"
notes = "The 5-tile girih primitive set (decagon, pentagon, rhombus, bowtie, hexagon). Use as a building-block reference; not directly tileable."
source = "https://commons.wikimedia.org/wiki/File:Girih_tiles.svg"
license = "Public domain"
recolorable = true
file_size = "7.2 KB"

