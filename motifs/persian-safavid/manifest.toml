# ---- Arabesque / scrollwork --------------------------------------------------

[[motifs]]
file = "svg/arabesque-filet-divider.svg"
role = "border"
notes = "Thin horizontal arabesque filet — ideal as a section divider or under headlines."
source = "https://commons.wikimedia.org/wiki/File:Filet_arabesque.svg"
license = "Public domain"
recolorable = false
recolor_note = "Has hardcoded fills; needs preprocessing if we want to swap to palette colors."
file_size = "16 KB"

[[motifs]]
file = "svg/arabesque-palmette.svg"
role = "ornament"
notes = "Palmette/scroll ornament. Use as an inline accent, drop-cap surround, or repeating module."
source = "https://commons.wikimedia.org/wiki/File:Arabesque-153980_1280_.svg"
license = "Public domain"
recolorable = false
recolor_note = "Hardcoded fills."
file_size = "61 KB"

[[motifs]]
file = "svg/arabesque-serlio-headpiece.svg"
role = "headpiece"
notes = "Renaissance-era arabesque headpiece (Serlio, 1551). Italian Renaissance interpretation of Islamic vocabulary — visually compatible but not strictly Persian. Use sparingly for chapter-opener-style ornaments."
source = "https://commons.wikimedia.org/wiki/File:Arabesque_headpiece_from_Serlio_1551.svg"
license = "Public domain"
recolorable = true
file_size = "179 KB"

[[motifs]]
file = "svg/arabesque-serlio-tailpiece.svg"
role = "tailpiece"
notes = "Companion piece to the Serlio headpiece. Use to close out major sections."
source = "https://commons.wikimedia.org/wiki/File:Arabesque_tailpiece_from_Serlio_1551.svg"
license = "Public domain"
recolorable = true
file_size = "45 KB"

# ---- Architectural -----------------------------------------------------------

[[motifs]]
file = "svg/arch-ogee.svg"
role = "frame"
notes = "Ogee (S-curved pointed) arch silhouette. The asset is a technical diagram with construction marks; the generator should be instructed to extract just the silhouette path."
source = "https://commons.wikimedia.org/wiki/File:Ogee-shaped_arch.svg"
license = "Public domain"
recolorable = true
file_size = "5.2 KB"

[[motifs]]
file = "svg/arch-horseshoe.svg"
role = "frame"
notes = "Horseshoe-arch silhouette (Andalusian/Moorish vocabulary, visually adjacent to Persian arches). Includes measurement ticks; generator should extract clean curve path."
source = "https://commons.wikimedia.org/wiki/File:Arco-herradura.svg"
license = "Public domain"
recolorable = true
file_size = "9.2 KB"
