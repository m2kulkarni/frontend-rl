# Persian Safavid — animation vocabulary
# Loop animations that fit Safavid tilework / medallion / gold-shimmer aesthetic.
# The generator's design-system pass picks one of these by name and the page
# generator emits the matching @keyframes block.

[meta]
style = "persian-safavid"

[[animations]]
name = "girih-rotation"
description = "Slow continuous rotation of a centered geometric medallion."
applies_to = "centerpiece_seal"
duration_sec = 18
easing = "linear"
iteration_count = "infinite"
css = """\
@keyframes girih-rotation {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.animated-medallion {
  animation: girih-rotation 18s linear infinite;
  transform-origin: center;
}
"""

[[animations]]
name = "gold-shimmer"
description = "Gold-leaf border cycles brightness clearly — pulsing reflected-light shimmer."
applies_to = "section_dividers"
duration_sec = 3
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes gold-shimmer {
  0%, 100% { filter: brightness(0.7) saturate(0.8); }
  50%      { filter: brightness(1.6) saturate(1.4); }
}
.animated-divider {
  animation: gold-shimmer 3s ease-in-out infinite;
}
"""

[[animations]]
name = "seal-breathe"
description = "Central seal scales noticeably larger and back — a breathing rhythm."
applies_to = "centerpiece_seal"
duration_sec = 3
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes seal-breathe {
  0%, 100% { transform: scale(0.88); }
  50%      { transform: scale(1.18); }
}
.animated-seal {
  animation: seal-breathe 3s ease-in-out infinite;
  transform-origin: center;
}
"""
