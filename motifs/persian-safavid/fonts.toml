# Persian Safavid — typography pairings
# All fonts available on Google Fonts. The generator prompt quotes the chosen pairing's @import line.

[meta]
style = "persian-safavid"

# A pairing = one display + one body font that work together.
# We provide multiple pairings per variant so the sampler has within-style variation.

[[variants.period_faithful.pairings]]
name = "cinzel-cormorant"
display = "Cinzel Decorative"
display_weights = [400, 700, 900]
body = "Cormorant Garamond"
body_weights = [400, 500, 700]
notes = "Cinzel's Roman-capitals feel pairs with Cormorant's classical-serif body. Slightly anachronistic but visually authoritative."

[[variants.period_faithful.pairings]]
name = "almendra-spectral"
display = "Almendra SC"
display_weights = [400, 700]
body = "Spectral"
body_weights = [400, 500]
notes = "Almendra's medievaling small-caps reads as illuminated-manuscript; Spectral keeps the body readable."

[[variants.period_faithful.pairings]]
name = "marcellus-eb-garamond"
display = "Marcellus"
display_weights = [400]
body = "EB Garamond"
body_weights = [400, 500]
notes = "More restrained — works when the page is already heavy with ornament and the type needs to step back."

[[variants.modern.pairings]]
name = "playfair-inter"
display = "Playfair Display"
display_weights = [400, 700, 900]
body = "Inter"
body_weights = [400, 500, 600]
notes = "Modern editorial pairing. Lets the palette and motifs carry the style commitment."

[[variants.modern.pairings]]
name = "dm-serif-source-sans"
display = "DM Serif Display"
display_weights = [400]
body = "Source Sans 3"
body_weights = [400, 600]
notes = "Slightly more contemporary than Playfair. Reads as 'design studio' rather than 'magazine'."

[[variants.bold.pairings]]
name = "cinzel-decorative-cormorant-bold"
display = "Cinzel Decorative"
display_weights = [400, 700, 900]
body = "Cormorant Garamond"
body_weights = [400, 500, 700]
notes = "High-contrast inscriptional display + classical body — reads as gold-leaf type on cobalt."

[[variants.bold.pairings]]
name = "almendra-spectral-bold"
display = "Almendra SC"
display_weights = [400, 700]
body = "Spectral"
body_weights = [400, 500]
notes = "Illuminated-manuscript display + editorial body for a moodier read."
