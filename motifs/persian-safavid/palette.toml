# Persian Safavid — palette
# Anchored on Isfahan tilework (Sheikh Lotfollah, Imam Mosque, Chehel Sotoun).
# Named colors are stable; role mappings vary by `variant`.

[meta]
style = "persian-safavid"

[colors]
isfahan_cobalt = "#1e3a5f"      # deep tile blue, the dominant ground
turquoise = "#2a8a8a"            # the second tile blue, often paired
celadon = "#a8c5a8"              # pale green-blue, used in floral fills
gold = "#c9a23a"                 # leaf gold for outlines and small ornament
ochre = "#b8762e"                # warm earth, used in figurative tile
oxblood = "#7a1f2e"              # madder red, a sparing accent
ivory = "#f2e5cc"                # cream plaster, the negative-space background
lapis_dark = "#0f1f3d"           # near-black with a blue cast — used for outlines and text
brick = "#c5824a"                # baked-clay warm neutral, brickwork backgrounds

# Role mapping: period-faithful — committed, dense, dark-on-light
[variants.period_faithful]
background = "ivory"
surface = "brick"
primary = "isfahan_cobalt"
secondary = "turquoise"
accent = "gold"
text = "lapis_dark"
text_emphasis = "oxblood"
ornament = "gold"

# Role mapping: modern interpretation — restrained, the palette as accent rather than ground
[variants.modern]
background = "ivory"
surface = "ivory"
primary = "lapis_dark"
secondary = "turquoise"
accent = "gold"
text = "lapis_dark"
text_emphasis = "isfahan_cobalt"
ornament = "isfahan_cobalt"
