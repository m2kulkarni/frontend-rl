# Roman Imperial — palette
# Anchored on Pompeian fresco palette + Imperial-era stonework + bronze patina.

[meta]
style = "roman-imperial"

[colors]
travertine_cream = "#e8dcc4"   # the dominant stone palette ground
marble_white     = "#f5f0e6"   # cooler marble
pompeian_red     = "#a93226"   # the iconic red of Pompeii's wall paintings
imperial_purple  = "#4d1c5e"   # Tyrian purple, used sparingly as power signal
gold_leaf        = "#c9a23a"   # gilt accent
bronze_patina    = "#5a8c7e"   # verdigris on aged bronze
lapis            = "#1e3a8a"   # blue used in mosaic, frescoes
ink_black        = "#1a1a1a"   # for text and outlines

[variants.period_faithful]
background = "travertine_cream"
surface    = "marble_white"
primary    = "pompeian_red"
secondary  = "gold_leaf"
accent     = "imperial_purple"
ornament   = "gold_leaf"
text       = "ink_black"
text_emphasis = "pompeian_red"

[variants.modern]
background = "marble_white"
surface    = "marble_white"
primary    = "ink_black"
secondary  = "gold_leaf"
accent     = "pompeian_red"
ornament   = "ink_black"
text       = "ink_black"
text_emphasis = "imperial_purple"

# Bold: pompeian-red wall as canvas — fresco room turned into a website.
[variants.bold]
background = "pompeian_red"
surface = "ink_black"
primary = "marble_white"
secondary = "gold_leaf"
accent = "imperial_purple"
ornament = "gold_leaf"
text = "marble_white"
text_emphasis = "gold_leaf"
