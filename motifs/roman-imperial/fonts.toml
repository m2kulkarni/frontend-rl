# Roman Imperial — typography pairings
# All fonts available on Google Fonts.

[meta]
style = "roman-imperial"

[[variants.period_faithful.pairings]]
name = "cinzel-eb-garamond"
display = "Cinzel"
display_weights = [400, 600, 700, 900]
body = "EB Garamond"
body_weights = [400, 500, 700]
notes = "Cinzel is literally based on the inscription on Trajan's Column. Pairs naturally with the most authoritative classical-serif body."

[[variants.period_faithful.pairings]]
name = "cinzel-decorative-cormorant"
display = "Cinzel Decorative"
display_weights = [400, 700, 900]
body = "Cormorant Garamond"
body_weights = [400, 500, 700]
notes = "More ornate display, useful when the page already commits to dense ornament."

[[variants.period_faithful.pairings]]
name = "marcellus-spectral"
display = "Marcellus"
display_weights = [400]
body = "Spectral"
body_weights = [400, 500]
notes = "Restrained — works when palette and ornament are doing the heavy lifting."

[[variants.modern.pairings]]
name = "playfair-lora"
display = "Playfair Display"
display_weights = [400, 700, 900]
body = "Lora"
body_weights = [400, 500, 600]
notes = "Modern editorial pairing. Lets palette commitment carry the classical reference."

[[variants.modern.pairings]]
name = "marcellus-inter"
display = "Marcellus"
display_weights = [400]
body = "Inter"
body_weights = [400, 500, 600]
notes = "Slightly more contemporary; reads as 'museum institution' rather than 'magazine'."
