# Roman Imperial — animation vocabulary
# Restrained civic motion: slow fades, slight glides. No flashy effects.

[meta]
style = "roman-imperial"

[[animations]]
name = "wreath-fade"
description = "Hero wreath roundel fades opacity in and out — clearly visible pulse."
applies_to = "centerpiece_seal"
duration_sec = 4
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes wreath-fade {
  0%, 100% { opacity: 1;   transform: scale(1); }
  50%      { opacity: 0.35; transform: scale(0.9); }
}
.animated-wreath {
  animation: wreath-fade 4s ease-in-out infinite;
  transform-origin: center;
}
"""

[[animations]]
name = "meander-glide"
description = "Greek-key border slowly slides horizontally — frieze drifting past."
applies_to = "section_dividers"
duration_sec = 12
easing = "linear"
iteration_count = "infinite"
css = """\
@keyframes meander-glide {
  from { background-position: 0 0; }
  to   { background-position: 80px 0; }
}
.animated-meander {
  animation: meander-glide 12s linear infinite;
}
"""

[[animations]]
name = "torch-flicker"
description = "Inline ornament color subtly cycles — bronze glow rising and falling, like an oil-lamp flicker."
applies_to = "ornament_inline"
duration_sec = 1.5
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes torch-flicker {
  0%, 100% { color: var(--accent); }
  50%      { color: var(--ornament); }
}
.animated-flicker {
  animation: torch-flicker 1.5s ease-in-out infinite;
}
"""
