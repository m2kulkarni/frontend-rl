# Roman Imperial — motif manifest
# Every SVG sourced from public-domain or freely-licensed origins.

[meta]
style = "roman-imperial"
asset_root = "svg/"
notes = """
v1 library. 14 SVGs from Wikimedia Commons, all PD.
Several pieces are post-classical Western interpretations (Serlio 1551,
Cleland 1923, ATF 1923) — visually compatible with Roman vocabulary.
Real gaps: no clean PD acanthus, Corinthian capital, mosaic, or Vitruvian-wave SVGs exist.
"""

# ---- Borders & meanders ------------------------------------------------------

[[motifs]]
file = "svg/meander-greek-key.svg"
role = "border"
notes = "Greek key (meander) border. Tile horizontally across section dividers and headers."
source = "https://commons.wikimedia.org/wiki/File:Greekkey.svg"
license = "Public domain"
recolorable = true

# ---- Wreaths & frames --------------------------------------------------------

[[motifs]]
file = "svg/laurel-wreath-open.svg"
role = "frame"
notes = "Open-top laurel wreath, classic Greco-Roman victory motif. Use as title frame or section seal."
source = "https://commons.wikimedia.org/wiki/File:Greek_Roman_Laurel_wreath_vector.svg"
license = "CC0"
recolorable = true

[[motifs]]
file = "svg/olive-wreath-circle.svg"
role = "frame"
notes = "Closed circular olive wreath. Use as roundel for centerpiece content."
source = "https://commons.wikimedia.org/wiki/File:Olive_wreath.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/laurel-wreath-frame.svg"
role = "frame"
notes = "Empty laurel wreath outline designed to surround content."
source = "https://commons.wikimedia.org/wiki/File:LaurelWreath-empty.svg"
license = "CC0"
recolorable = true

[[motifs]]
file = "svg/oak-wreath-roundel.svg"
role = "centerpiece"
notes = "Oak-leaf wreath roundel (Cleland / ATF, 1923). Use as a chapter-mark or major-section title frame."
source = "https://commons.wikimedia.org/wiki/File:Cleland_ornament_10818_(oak_wreath).svg"
license = "Public domain"
recolorable = true

# ---- Architectural -----------------------------------------------------------

[[motifs]]
file = "svg/ionic-order-column.svg"
role = "ornament"
notes = "Detailed Ionic-order line drawing with labeled architectural parts (entablature, capital, shaft, base). Use as a structural illustration / sidebar ornament."
source = "https://commons.wikimedia.org/wiki/File:Ionic_order.svg"
license = "Public domain"
recolorable = true

# ---- Typographic ornaments (ATF 1923) ----------------------------------------

[[motifs]]
file = "svg/ornament-lyre-laurels.svg"
role = "centerpiece"
notes = "Lyre flanked by laurel branches (ATF specimen, 1923). Reads as 'arts / academic' ornament."
source = "https://commons.wikimedia.org/wiki/File:Twentieth_Century_Ornament_21_(lyre_with_laurels).svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/ornament-fasces.svg"
role = "ornament"
notes = "Roman fasces (axe-bundle of authority) with ribbons (ATF, 1923). Use sparingly — modern political associations exist."
source = "https://commons.wikimedia.org/wiki/File:Twentieth_Century_Ornament_80_(fasces_with_ribbons).svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/ornament-caryatid.svg"
role = "ornament"
notes = "Caryatid figure holding a scroll, vertical ornament (ATF, 1923). Use as side ornament for tall layouts."
source = "https://commons.wikimedia.org/wiki/File:Twentieth_Century_Ornament_11_(Caryatid_with_scroll).svg"
license = "Public domain"
recolorable = true

# ---- Inline foliate ornaments ------------------------------------------------

[[motifs]]
file = "svg/vine-leaf-ornament.svg"
role = "ornament"
notes = "Tiny vine-leaf typographic ornament. Use as inline rinceau-style break, drop-cap accent."
source = "https://commons.wikimedia.org/wiki/File:Vine_leaf_ornament.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/oak-leaf-acorn.svg"
role = "ornament"
notes = "Oak-leaf and acorn line-art ornament (1915). Use as section divider or border accent."
source = "https://commons.wikimedia.org/wiki/File:Oak-leaf_and_acorn_ornament.svg"
license = "Public domain"
recolorable = true

# ---- Renaissance interpretations of classical vocabulary ---------------------

[[motifs]]
file = "svg/serlio-headpiece.svg"
role = "headpiece"
notes = "Wide arabesque/rinceau scroll headpiece from Serlio's 1551 architectural treatise. Italian Renaissance reading of Roman ornament — visually compatible."
source = "https://commons.wikimedia.org/wiki/File:Arabesque_headpiece_from_Serlio_1551.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/serlio-tailpiece.svg"
role = "tailpiece"
notes = "Compact arabesque tailpiece from Serlio 1551. Section-end ornament."
source = "https://commons.wikimedia.org/wiki/File:Arabesque_tailpiece_from_Serlio_1551.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/roma-antica-tailpiece.svg"
role = "tailpiece"
notes = "Grotesque/foliate tailpiece from 'Roma antica' (1661). Larger and more figural than the Serlio tailpiece."
source = "https://commons.wikimedia.org/wiki/File:Tailpiece,_p._323,_from_Roma_antica,_1661.svg"
license = "Public domain"
recolorable = true
