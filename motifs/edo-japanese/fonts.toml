# Edo Japanese — typography pairings
# All fonts available on Google Fonts.

[meta]
style = "edo-japanese"

[[variants.period_faithful.pairings]]
name = "yuji-syuku-shippori"
display = "Yuji Syuku"
display_weights = [400]
body = "Shippori Mincho"
body_weights = [400, 500, 700]
notes = "Yuji Syuku is calligraphic-brush display (Latin glyphs styled to feel hand-brushed); Shippori Mincho is a contemporary Japanese serif with full Latin set."

[[variants.period_faithful.pairings]]
name = "klee-noto-serif"
display = "Klee One"
display_weights = [400, 600]
body = "Noto Serif JP"
body_weights = [400, 500, 700]
notes = "Klee One is a softer brush-influenced display; Noto Serif JP carries the typographic gravitas."

[[variants.modern.pairings]]
name = "shippori-inter"
display = "Shippori Mincho"
display_weights = [500, 700, 900]
body = "Inter"
body_weights = [400, 500, 600]
notes = "Editorial pairing — Shippori carries Japanese typographic heritage; Inter is the universal modern body."

[[variants.modern.pairings]]
name = "kosugi-source-sans"
display = "Kosugi Maru"
display_weights = [400]
body = "Source Sans 3"
body_weights = [400, 600]
notes = "Kosugi Maru is rounded geometric — reads as 'contemporary Japanese design studio' rather than 'museum'."

[[variants.modern.pairings]]
name = "sawarabi-mincho-system"
display = "Sawarabi Mincho"
display_weights = [400]
body = "Sawarabi Gothic"
body_weights = [400]
notes = "Within-family pairing — the Sawarabi pair is restrained, formal, suitable for serious editorial."
