# Edo Japanese — palette
# Anchored on indigo-dyed textiles + woodblock prints + sumi ink + cinnabar lacquer.

[meta]
style = "edo-japanese"

[colors]
kraft_paper      = "#d9c8a5"   # unbleached washi paper ground
off_white        = "#f5efde"   # bleached paper, the lighter ground
indigo_ai        = "#1c3a5e"   # the dominant kimono dye color
indigo_deep      = "#0c1e3d"   # darker indigo for outlines/text
sumi_ink         = "#0c0c0c"   # carbon-black ink — for outlines and emphasis
cinnabar         = "#e34234"   # vermilion lacquer / torii red
persimmon        = "#d97c3a"   # warm orange accent
moss_green       = "#4d6450"   # subdued green
gold_leaf        = "#c9a23a"   # gilt accent (sparing)
soot_brown       = "#3a2a1c"   # used for wood / tree silhouettes

[variants.period_faithful]
background = "kraft_paper"
surface    = "off_white"
primary    = "indigo_ai"
secondary  = "cinnabar"
accent     = "gold_leaf"
ornament   = "sumi_ink"
text       = "sumi_ink"
text_emphasis = "cinnabar"

[variants.modern]
background = "off_white"
surface    = "off_white"
primary    = "sumi_ink"
secondary  = "indigo_ai"
accent     = "cinnabar"
ornament   = "sumi_ink"
text       = "sumi_ink"
text_emphasis = "indigo_ai"
