# Edo Japanese — animation vocabulary
# Subdued, slow motion in keeping with restraint and ma (negative space).

[meta]
style = "edo-japanese"

[[animations]]
name = "seigaiha-drift"
description = "Wave-pattern background slides diagonally — slow ocean drift across the page."
applies_to = "background_pattern"
duration_sec = 20
easing = "linear"
iteration_count = "infinite"
css = """\
@keyframes seigaiha-drift {
  from { background-position: 0 0; }
  to   { background-position: 60px 60px; }
}
.animated-seigaiha {
  animation: seigaiha-drift 20s linear infinite;
}
"""

[[animations]]
name = "kamon-pulse"
description = "Kamon (family crest) pulses opacity and scale — clearly visible lantern flicker."
applies_to = "centerpiece_seal"
duration_sec = 2
easing = "ease-in-out"
iteration_count = "infinite"
css = """\
@keyframes kamon-pulse {
  0%, 100% { opacity: 1;    transform: scale(1.05); }
  50%      { opacity: 0.55; transform: scale(0.85); }
}
.animated-kamon {
  animation: kamon-pulse 2s ease-in-out infinite;
  transform-origin: center;
}
"""

[[animations]]
name = "sakura-fall"
description = "Petal motif drifts downward and fades — recurring falling-blossom motion."
applies_to = "ornament_inline"
duration_sec = 8
easing = "linear"
iteration_count = "infinite"
css = """\
@keyframes sakura-fall {
  0%   { transform: translateY(-20px) rotate(0deg);   opacity: 0; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translateY(60px)  rotate(180deg); opacity: 0; }
}
.animated-sakura {
  animation: sakura-fall 8s linear infinite;
}
"""
