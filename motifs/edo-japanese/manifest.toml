# Edo Japanese — motif manifest

[meta]
style = "edo-japanese"
asset_root = "svg/"
notes = """
v1 library. 13 SVGs from Wikimedia Commons. Strong coverage:
authentic wagara textile patterns (seigaiha, shippō, asanoha, sayagata, kikkō)
plus 8 traditional kamon (family crests).

License caveat: traditional kamon designs are pre-1868 PD by age, but the
SVG renderings on Commons are typically CC-BY-SA 3.0 / GFDL. We accept
attribution requirement; alternative is a much smaller library. Each
generated website using kamon will append an attribution line in the footer.

Strict-PD-only files: Seigaiha.svg (PD), Shippou.svg (PD), Goshichi_no_kiri.svg
(PD Mark), Sayagata_(line).svg (CC0).
"""

# ---- Wagara — tile-able textile patterns -------------------------------------

[[motifs]]
file = "svg/seigaiha-waves.svg"
role = "tessellation"
notes = "Seigaiha — overlapping concentric arcs / stylized waves. Tile horizontally for backgrounds. The most iconic wagara."
source = "https://commons.wikimedia.org/wiki/File:Seigaiha.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/shippou-circles.svg"
role = "tessellation"
notes = "Shippō — interlocking circles ('seven treasures' pattern). Tile in square grid."
source = "https://commons.wikimedia.org/wiki/File:Shippou.svg"
license = "Public domain"
recolorable = true

[[motifs]]
file = "svg/asanoha-hempleaf.svg"
role = "tessellation"
notes = "Asanoha — hexagonal hemp-leaf star pattern. Tile in hex grid for kimono-textile backgrounds."
source = "https://commons.wikimedia.org/wiki/File:Asanoha.svg"
license = "CC-BY-SA / GFDL (design pre-1868 PD)"
recolorable = true

[[motifs]]
file = "svg/sayagata-keyfret.svg"
role = "tessellation"
notes = "Sayagata — interlocking manji key-fret. Geometric meander, line-only."
source = "https://commons.wikimedia.org/wiki/File:Sayagata_(line).svg"
license = "CC0"
recolorable = true

[[motifs]]
file = "svg/kikko-tortoiseshell.svg"
role = "ornament"
notes = "Kikkō — tortoise-shell hexagon framing a manji. Sample of the kikkō pattern (use as small ornament rather than tile)."
source = "https://commons.wikimedia.org/wiki/File:Mon_Kikko_ni_Manji.svg"
license = "CC-BY-SA"
recolorable = true

